<!DOCTYPE html>
<html>
<head>
    <title>Human Action Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Human Action Detection</h1>
    <p class="subtitle">Detect Standing, Sitting, Walking using AI</p>
    <div class="button-group">
        <button id="startBtn" onclick="startCamera()">Get Started</button>
        <button id="stopBtn" onclick="stopCamera()" style="display:none;">Stop Camera</button>
    </div>
    <p id="status">Camera Off</p>
    <img id="video" style="display:none; width:600px; margin-top:20px;" />
</div>
<script src="script.js"></script>
</body>
</html>
